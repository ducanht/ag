<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#022753" />
  <title>Antigravity Link</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: linear-gradient(135deg, #022753 0%, #004AA1 100%);
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }
    .card {
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      padding: 28px 20px;
      max-width: 380px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }
    .spinner {
      width: 42px; height: 42px;
      border: 3px solid rgba(255,255,255,0.2);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h2 { font-size: 19px; font-weight: 700; margin-bottom: 8px; }
    p { font-size: 13px; color: #cbd5e1; margin-bottom: 16px; }
    .btn {
      display: inline-block;
      background: #16a34a;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
      padding: 11px 22px;
      border-radius: 12px;
      box-shadow: 0 4px 14px rgba(22,163,74,0.4);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h2>Đang mở Antigravity...</h2>
    <p id="statusMsg">Đang tải địa chỉ kết nối thời gian thực...</p>
    <a class="btn" id="directBtn" href="https://dish-extra-ham-arms.trycloudflare.com/?token=27s0pl91649mz57vrxuphs">Bấm vào đây để vào ngay</a>
  </div>
  <script>
    const FALLBACK_URL = "https://dish-extra-ham-arms.trycloudflare.com/?token=27s0pl91649mz57vrxuphs";
    let redirected = false;
    function go(targetUrl) {
      if (redirected || !targetUrl) return;
      redirected = true;
      document.getElementById('directBtn').href = targetUrl;
      document.getElementById('statusMsg').textContent = 'Đang kết nối vào máy tính...';
      window.location.replace(targetUrl);
    }
    const timer = setTimeout(() => go(FALLBACK_URL), 2500);
    fetch('https://raw.githubusercontent.com/' + "ducanht/ag" + '/main/url.json?t=' + Date.now(), { cache: 'no-store' })
      .then(r => r.json())
      .then(d => {
        clearTimeout(timer);
        if (d && d.url) {
          go(d.url);
        } else {
          go(FALLBACK_URL);
        }
      })
      .catch(() => {
        clearTimeout(timer);
        go(FALLBACK_URL);
      });
  </script>
</body>
</html>
