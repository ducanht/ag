<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#022753" />
  <title>Antigravity Link</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: linear-gradient(135deg, #022753 0%, #1B3C7B 55%, #004AA1 100%);
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }
    .card {
      background: rgba(15, 23, 42, 0.94);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 22px;
      padding: 30px 22px;
      max-width: 390px;
      width: 100%;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.45);
    }
    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.4px;
      color: #7dd3fc;
      background: rgba(56, 189, 248, 0.14);
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 5px 12px;
      border-radius: 999px;
      margin-bottom: 18px;
    }
    .spinner {
      width: 44px; height: 44px;
      border: 3px solid rgba(255, 255, 255, 0.18);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
      margin: 0 auto 18px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h2 { font-size: 20px; font-weight: 800; margin-bottom: 8px; }
    p { font-size: 13.5px; color: #cbd5e1; margin-bottom: 20px; line-height: 1.5; }
    .actions { display: flex; flex-direction: column; gap: 10px; }
    .btn {
      display: block;
      background: #16a34a;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      font-size: 15px;
      padding: 13px 20px;
      border-radius: 13px;
      box-shadow: 0 4px 16px rgba(22, 163, 74, 0.35);
    }
    .btn-retry {
      background: rgba(255, 255, 255, 0.08);
      color: #e2e8f0;
      border: 1px solid rgba(255, 255, 255, 0.18);
      font-size: 13.5px;
      font-weight: 600;
      padding: 10px 16px;
      border-radius: 11px;
      cursor: pointer;
    }
    .meta { margin-top: 16px; font-size: 11.5px; color: #94a3b8; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">ANTIGRAVITY REMOTE</div>
    <div class="spinner"></div>
    <h2>Đang kết nối máy tính...</h2>
    <p id="statusMsg">Đang đồng bộ địa chỉ đường hầm mới nhất.</p>
    <div class="actions">
      <a class="btn" id="directBtn" href="https://twins-dial-completion-basement.trycloudflare.com/?token=27s0pl91649mz57vrxuphs">Mở Antigravity ngay</a>
      <button class="btn-retry" type="button" onclick="resolveAndGo(true)">Làm mới &amp; kết nối lại</button>
    </div>
    <div class="meta" id="metaInfo"></div>
  </div>
  <script>
    const FALLBACK_URL = "https://twins-dial-completion-basement.trycloudflare.com/?token=27s0pl91649mz57vrxuphs";
    const RAW_JSON = 'https://raw.githubusercontent.com/' + "ducanht/ag" + '/main/url.json';
    let redirected = false;

    function go(targetUrl) {
      if (redirected || !targetUrl) return;
      redirected = true;
      document.getElementById('directBtn').href = targetUrl;
      document.getElementById('statusMsg').textContent = 'Đã sẵn sàng, đang chuyển hướng...';
      window.location.replace(targetUrl);
    }

    function resolveAndGo(force) {
      if (force) redirected = false;
      document.getElementById('statusMsg').textContent = 'Đang kiểm tra đường hầm trực tiếp...';
      const timer = setTimeout(() => go(FALLBACK_URL), 2500);
      fetch(RAW_JSON + '?t=' + Date.now(), { cache: 'no-store' })
        .then(r => r.json())
        .then(d => {
          clearTimeout(timer);
          if (d && d.updatedAt) {
            document.getElementById('metaInfo').textContent = 'Cập nhật: ' + new Date(d.updatedAt).toLocaleString('vi-VN');
          }
          go((d && d.url) ? d.url : FALLBACK_URL);
        })
        .catch(() => {
          clearTimeout(timer);
          go(FALLBACK_URL);
        });
    }

    // Tự động lấy lại link mới khi mở lại PWA từ nền trên điện thoại
    window.addEventListener('pageshow', (e) => { if (e.persisted) resolveAndGo(true); });
    resolveAndGo(false);
  </script>
</body>
</html>
