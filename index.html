<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#022753" />
  <title>Antigravity Mobile</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    #topBar {
      height: 44px;
      background: #022753;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      z-index: 1000;
      position: relative;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }
    .dot {
      width: 8px;
      height: 8px;
      background: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 8px #22c55e;
    }
    .actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn-bar {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
    }
    .btn-bar:active {
      background: rgba(255, 255, 255, 0.3);
    }
    #frameWrap {
      position: absolute;
      top: 44px;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: calc(100% - 44px);
      background: #141218;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    #loadingNotice {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #94a3b8;
      font-size: 14px;
      text-align: center;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <header id="topBar">
    <div class="brand">
      <div class="dot" id="liveDot"></div>
      <span>Antigravity Link</span>
    </div>
    <div class="actions">
      <button class="btn-bar" id="refreshBtn" onclick="refreshTunnel()">🔄 Nối Lại</button>
      <a class="btn-bar" id="directLink" href="https://82b2fdf5997ac8.lhr.life/?token=27s0pl91649mz57vrxuphs" target="_blank">↗ Mở Rời</a>
    </div>
  </header>
  <main id="frameWrap">
    <div id="loadingNotice">Đang nạp phiên làm việc Antigravity...</div>
    <iframe id="mainFrame" src="https://82b2fdf5997ac8.lhr.life/?token=27s0pl91649mz57vrxuphs" allow="camera; microphone; clipboard-read; clipboard-write;" onload="onFrameLoaded()"></iframe>
  </main>
  <script>
    let currentUrl = "https://82b2fdf5997ac8.lhr.life/?token=27s0pl91649mz57vrxuphs";
    function onFrameLoaded() {
      const notice = document.getElementById('loadingNotice');
      if (notice) notice.style.display = 'none';
      document.getElementById('liveDot').style.background = '#22c55e';
    }
    async function refreshTunnel() {
      document.getElementById('liveDot').style.background = '#eab308';
      try {
        const res = await fetch('https://raw.githubusercontent.com/ducanht/ag/main/url.json?t=' + Date.now(), { cache: 'no-store' });
        const d = await res.json();
        if (d && d.url) {
          currentUrl = d.url;
          document.getElementById('mainFrame').src = d.url;
          document.getElementById('directLink').href = d.url;
        }
      } catch (e) {
        document.getElementById('mainFrame').src = currentUrl + (currentUrl.includes('?') ? '&' : '?') + 'r=' + Date.now();
      }
    }
    // Tự động kiểm tra URL mới mỗi 20 giây ở background
    setInterval(async () => {
      try {
        const res = await fetch('https://raw.githubusercontent.com/ducanht/ag/main/url.json?t=' + Date.now(), { cache: 'no-store' });
        const d = await res.json();
        if (d && d.url && d.url !== currentUrl) {
          console.log('Tunnel updated:', d.url);
          currentUrl = d.url;
          document.getElementById('mainFrame').src = d.url;
          document.getElementById('directLink').href = d.url;
        }
      } catch {}
    }, 20000);
  </script>
</body>
</html>
