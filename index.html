<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Antigravity" />
  <title>Antigravity Link — Đang Kết Nối...</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #022753 0%, #004AA1 100%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }
    .card {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 32px 24px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(255, 255, 255, 0.2);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 18px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 19px; font-weight: 700; margin-bottom: 8px; }
    p { font-size: 14px; color: #cbd5e1; line-height: 1.5; margin-bottom: 14px; }
    .btn {
      display: inline-block;
      background: #0284c7;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      padding: 10px 18px;
      border-radius: 10px;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner" id="sp"></div>
    <h1 id="title">Đang kết nối Antigravity...</h1>
    <p id="desc">Đang tự động chuyển hướng tới phiên làm việc mới nhất trên máy tính.</p>
    <div id="action"></div>
  </div>
  <script>
    const GIST_ID = 'c77dc688b7ac2602857f8a2947611334';
    async function connect() {
      try {
        const res = await fetch('https://api.github.com/gists/' + GIST_ID + '?t=' + Date.now(), {
          cache: 'no-store'
        });
        const gist = await res.json();
        const raw = gist.files && gist.files['ag-tunnel.json'] && gist.files['ag-tunnel.json'].content;
        if (raw) {
          const data = JSON.parse(raw);
          if (data.url && data.url.startsWith('https://')) {
            document.getElementById('desc').textContent = 'Đã tìm thấy máy chủ! Đang mở giao diện...';
            document.getElementById('action').innerHTML = '<a class="btn" href="' + data.url + '">Bấm vào đây nếu chưa tự chuyển</a>';
            window.location.replace(data.url);
            return;
          }
        }
      } catch (e) {}
      document.getElementById('desc').textContent = 'Đang chờ máy tính thức dậy hoặc kết nối mạng... Tự động thử lại sau 3 giây.';
      setTimeout(connect, 3000);
    }
    connect();
  </script>
</body>
</html>
