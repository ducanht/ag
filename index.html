<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Antigravity Link — Chuyển Hướng Nhanh</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #022753 0%, #004AA1 100%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }
    .card {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 20px;
      padding: 32px 24px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(255, 255, 255, 0.2);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto 18px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 19px; font-weight: 700; margin-bottom: 8px; }
    p { font-size: 14px; color: #cbd5e1; line-height: 1.5; margin-bottom: 14px; }
    .btn {
      display: inline-block;
      background: #22c55e;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      font-size: 15px;
      padding: 12px 22px;
      border-radius: 12px;
      margin-top: 6px;
      box-shadow: 0 6px 20px rgba(34, 197, 94, 0.35);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h1>Đang mở Antigravity...</h1>
    <p id="desc">Đang kết nối trực tiếp vào máy tính của Chủ tịch Trịnh Đức Anh.</p>
    <div id="action">
      <a class="btn" id="directBtn" href="https://domains-powers-downtown-grammar.trycloudflare.com/?token=27s0pl91649mz57vrxuphs">Bấm vào đây để vào ngay</a>
    </div>
  </div>
  <script>
    const FALLBACK_URL = "https://domains-powers-downtown-grammar.trycloudflare.com/?token=27s0pl91649mz57vrxuphs";
    let redirected = false;
    function go(targetUrl) {
      if (redirected || !targetUrl) return;
      redirected = true;
      document.getElementById('directBtn').href = targetUrl;
      window.location.replace(targetUrl);
    }
    // Tự động chuyển hướng sau tối đa 600ms kể cả khi mạng di động chặn fetch
    const timer = setTimeout(() => go(FALLBACK_URL), 600);
    fetch('https://raw.githubusercontent.com/ducanht/ag/main/url.json?t=' + Date.now(), { cache: 'no-store' })
      .then(r => r.json())
      .then(d => {
        clearTimeout(timer);
        go((d && d.url) ? d.url : FALLBACK_URL);
      })
      .catch(() => {
        clearTimeout(timer);
        go(FALLBACK_URL);
      });
  </script>
</body>
</html>
